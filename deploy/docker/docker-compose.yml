services:
  mysql:
    image: mysql:5.7
    container_name: asset-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: asset-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};CharSet=utf8mb4;
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: AssetManagement
      Jwt__ExpireMinutes: 120
      Database__AutoMigrate: ${DATABASE_AUTO_MIGRATE:-true}
      Database__AutoSeed: ${DATABASE_AUTO_SEED:-true}
      Attachment__Path: /app/uploads
      DatabaseBackup__Path: /app/backups
      DatabaseBackup__RetentionDays: 30
      DatabaseBackup__MysqldumpPath: mysqldump
    volumes:
      - upload-data:/app/uploads
      - backup-data:/app/backups

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: asset-web
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mysql-data:
  upload-data:
  backup-data:
